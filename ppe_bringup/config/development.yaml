ppe_perception:
  ros__parameters:
    camera_topic: /camera/image_raw
    detector_mode: mock
    source: mock_camera
    confidence_threshold: 0.50
ppe_decision:
  ros__parameters:
    violation_confirmation_frames: 3
    violation_confirmation_seconds: 0.40
    alert_cooldown_seconds: 15.0
ppe_alert:
  ros__parameters:
    enable_voice: false
ppe_logger:
  ros__parameters:
    database_path: data/ppe_events.db
ppe_navigation_guard:
  ros__parameters:
    dry_run: true
    cmd_vel_topic: /cmd_vel
